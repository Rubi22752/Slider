<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .btn-primary { border-radius: 10px; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card shadow">
        <h1 class="text-success fw-bold">Formularios</h1>
        <h3 class="text-primary mb-4">Ejemplo de un registro</h3>
        <form id="form-acceso">
            <div class="mb-3 text-start">
                <label class="form-label text-secondary fw-bold">Usuario</label>
                <input type="text" id="nombre" class="form-control" placeholder="Rubi" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-secondary fw-bold">Email</label>
                <input type="email" id="email" class="form-control" placeholder="tu-correo@gmail.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Guardar usuario en la base de datos</button>
        </form>
    </div>

    <script>
        $('#form-acceso').on('submit', function(e) {
            e.preventDefault();
            $.ajax({
                url: '/verificar_login',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ nombre: $('#nombre').val(), email: $('#email').val() }),
                success: function(res) {
                    // Independientemente de si existía o no, ahora ya está en la DB
                    window.location.href = '/slider';
                }
            });
        });
    </script>
</body>
</html>
